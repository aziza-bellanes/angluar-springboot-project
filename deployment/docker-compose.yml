services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-psm_db}?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USER: ${MYSQL_USER:-psm}
      DB_PASSWORD: ${MYSQL_PASSWORD:-psm_dev_password}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM in .env}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      CORS_ORIGIN: ${CORS_ORIGIN:-https://psm.example.com}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-psm_db}
      MYSQL_USER: ${MYSQL_USER:-psm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-psm_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 15
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  mysql_data:
