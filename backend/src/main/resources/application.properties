spring.application.name=psm-smart-manager
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/psm_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:psm}
spring.datasource.password=${DB_PASSWORD:psm_dev_password}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
psm.admin.email=${ADMIN_EMAIL:admin@example.test}
psm.mail.from=${MAIL_FROM:${ADMIN_EMAIL:admin@example.test}}
psm.jwt.secret=${JWT_SECRET:}
psm.jwt.expiration-ms=86400000
psm.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
psm.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
psm.cors.origin=${CORS_ORIGIN:http://localhost:4200}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.error.include-message=always
